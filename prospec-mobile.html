<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prospec">
    <meta name="theme-color" content="#0b1329">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <title>Prospec Mobile — Discador Nativo</title>
    
    <!-- Boxicons Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- App Mobile CSS -->
    <link rel="stylesheet" href="css/prospec-mobile.css?v=1.0">
</head>
<body>

    <!-- App Mobile Header -->
    <header class="mobile-header">
        <div class="mobile-brand">
            <i class='bx bx-phone-call' style="color:var(--call-color);"></i>
            <span>Prospec <span style="font-size:0.75rem;color:var(--call-color);font-weight:600;">• Discador</span></span>
        </div>
        <button onclick="ProspecApp.switchTab('new')" class="btn-mobile btn-mobile-primary" style="padding:0.4rem 0.8rem;font-size:0.8rem;width:auto;">
            <i class='bx bx-plus'></i> Novo
        </button>
    </header>

    <!-- App Mobile Main Container -->
    <main class="mobile-container">

        <!-- TAB 1: LISTA COM DISCADOR NATIVO -->
        <section id="view-list" class="view-section">
            
            <!-- Smart App Download Banner -->
            <div style="background:linear-gradient(135deg, #1e1b4b, #311b92);border:1px solid rgba(99,102,241,0.4);border-radius:12px;padding:0.75rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;box-shadow:0 4px 14px rgba(99,102,241,0.25);">
                <div style="display:flex;align-items:center;gap:0.6rem;">
                    <i class='bx bxl-android' style="font-size:1.5rem;color:#10b981;"></i>
                    <div>
                        <div style="font-size:0.82rem;font-weight:800;color:#ffffff;">Baixar App no Celular (.APK)</div>
                        <div style="font-size:0.7rem;color:#cbd5e1;">Instale direto no seu smartphone</div>
                    </div>
                </div>
                <a href="download.html" class="btn-mobile btn-mobile-primary" style="padding:0.35rem 0.75rem;font-size:0.75rem;width:auto;white-space:nowrap;background:#10b981;box-shadow:none;">
                    Baixar
                </a>
            </div>

            <!-- Barra de Busca Mobile -->
            <div class="mobile-search-bar">
                <i class='bx bx-search'></i>
                <input type="text" id="prospec-search" class="mobile-input" placeholder="Buscar empresa, contato ou cidade...">
            </div>

            <!-- Filtros Rápidos Pílulas -->
            <div style="display:flex;gap:0.5rem;overflow-x:auto;margin-bottom:1rem;padding-bottom:0.3rem;">
                <select id="filter-city" class="mobile-input" style="padding:0.4rem 0.6rem;font-size:0.78rem;width:auto;flex:1;">
                    <option value="">Todas as Cidades</option>
                </select>
                <select id="filter-contacted" class="mobile-input" style="padding:0.4rem 0.6rem;font-size:0.78rem;width:auto;flex:1;">
                    <option value="">Status: Todos</option>
                    <option value="Sim">🟢 Já Falou</option>
                    <option value="Não">⚪ Não Falou</option>
                </select>
                <select id="filter-rating" class="mobile-input" style="padding:0.4rem 0.6rem;font-size:0.78rem;width:auto;flex:1;">
                    <option value="">Avaliação: Todas</option>
                    <option value="Boa">🟢 Boa</option>
                    <option value="Média">🟡 Média</option>
                    <option value="Ruim">🔴 Ruim</option>
                    <option value="Péssima">🟣 Péssima</option>
                </select>
            </div>

            <!-- Lista de Cards Móveis -->
            <div id="mobile-cards-list">
                <!-- Rendered dynamically via JS -->
            </div>

            <div id="prospec-pagination"></div>
        </section>

        <!-- TAB 2: FUNIL DE NEGOCIAÇÕES MÓVEL -->
        <section id="view-kanban" class="view-section hidden">
            <div style="margin-bottom:1rem;">
                <h3 style="font-size:1rem;font-weight:800;">🤝 Negociações</h3>
                <p style="font-size:0.78rem;color:var(--text-muted);">Acompanhe o avanço comercial por etapas</p>
            </div>

            <div id="kanban-board-container" style="display:flex;flex-direction:column;gap:1rem;">
                <!-- Rendered dynamically -->
            </div>
        </section>

        <!-- TAB 3: CADASTRO MÓVEL SIMPLES -->
        <section id="view-new" class="view-section hidden">
            <div class="mobile-card" style="padding:1.25rem;">
                <h3 style="font-size:1.1rem;font-weight:800;margin-bottom:0.3rem;display:flex;align-items:center;gap:0.4rem;">
                    <i class='bx bx-user-plus' style="color:var(--primary);"></i> Cadastrar Prospecto
                </h3>
                <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:1.2rem;">Preencha os dados do cliente para iniciar as ligações</p>

                <form id="simple-register-form">
                    <div style="display:flex;flex-direction:column;gap:1rem;">
                        <div>
                            <label style="display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;">Razão Social / Nome *</label>
                            <input type="text" id="reg-razaosocial" class="mobile-input" style="padding-left:0.9rem;" required placeholder="Ex: Supermercado Silva">
                        </div>

                        <div>
                            <label style="display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;">Nome do Comprador</label>
                            <input type="text" id="reg-buyer" class="mobile-input" style="padding-left:0.9rem;" placeholder="Ex: Sr. Antônio">
                        </div>

                        <div>
                            <label style="display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;">Telefone / Celular *</label>
                            <input type="tel" id="reg-phone" class="mobile-input" style="padding-left:0.9rem;" required placeholder="(11) 98888-7777">
                        </div>

                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;">
                            <div>
                                <label style="display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;">Cidade *</label>
                                <input type="text" id="reg-city" class="mobile-input" style="padding-left:0.9rem;" required placeholder="Campinas">
                            </div>
                            <div>
                                <label style="display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;">Região</label>
                                <input type="text" id="reg-region" class="mobile-input" style="padding-left:0.9rem;" placeholder="Interior SP">
                            </div>
                        </div>

                        <div>
                            <label style="display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.3rem;">Anotações Iniciais</label>
                            <textarea id="reg-notes" class="mobile-notes-area" rows="3" placeholder="Observações das necessidades do cliente..."></textarea>
                        </div>

                        <button type="submit" class="btn-mobile btn-mobile-primary" style="margin-top:0.5rem;">
                            <i class='bx bx-check-circle'></i> Salvar e Abrir Lista
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar (iOS / Android) -->
    <nav class="bottom-nav">
        <button id="tab-list" class="nav-item-btn active">
            <i class='bx bx-phone-call'></i>
            <span>Ligações</span>
        </button>
        <button id="tab-kanban" class="nav-item-btn">
            <i class='bx bx-git-repo-forked'></i>
            <span>Negócios</span>
        </button>
        <button id="tab-new" class="nav-item-btn">
            <i class='bx bx-plus-circle'></i>
            <span>Cadastrar</span>
        </button>
    </nav>

    <!-- Modal Anotações Tela Cheia Mobile -->
    <div id="prospec-notes-modal" class="mobile-modal-overlay hidden">
        <div class="mobile-modal-card">
            <div class="mobile-modal-header">
                <div>
                    <h3 id="notes-modal-title" style="font-size:1rem;font-weight:800;">📝 Anotações</h3>
                    <span id="notes-modal-subtitle" style="font-size:0.75rem;color:var(--text-muted);"></span>
                </div>
                <button onclick="document.getElementById('prospec-notes-modal').classList.add('hidden')" style="background:none;border:none;color:var(--text-muted);font-size:1.5rem;">&times;</button>
            </div>

            <input type="hidden" id="notes-modal-id">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;">
                <label style="font-weight:700;font-size:0.8rem;">Histórico de Conversas:</label>
                <button type="button" class="btn-mobile btn-mobile-outline" onclick="ProspecApp.insertNoteTimestamp()" style="padding:0.3rem 0.6rem;font-size:0.75rem;width:auto;">
                    <i class='bx bx-time'></i> + Data/Hora
                </button>
            </div>

            <textarea id="notes-modal-text" class="mobile-notes-area" rows="8" placeholder="Digite o histórico das chamadas, negociações e observações..." style="min-height:180px;font-size:0.9rem;line-height:1.45;"></textarea>

            <div style="display:flex;gap:0.8rem;margin-top:1rem;">
                <button class="btn-mobile btn-mobile-outline" onclick="document.getElementById('prospec-notes-modal').classList.add('hidden')">Fechar</button>
                <button class="btn-mobile btn-mobile-primary" onclick="ProspecApp.saveNotesModal()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/prospec-app.js?v=2.0"></script>
    <script>
        // Custom mobile render for cards with DISCADOR NATIVO TEL:
        const originalRenderList = ProspecApp.renderList;
        ProspecApp.renderList = function() {
            const container = document.getElementById('mobile-cards-list');
            if (!container) {
                if (originalRenderList) originalRenderList.call(this);
                return;
            }

            const filtered = this.getFilteredProspects();
            this.updateKPIs();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="mobile-card" style="text-align:center;padding:2rem;">
                        <i class='bx bx-phone-off' style="font-size:2.5rem;color:var(--text-muted);margin-bottom:0.5rem;"></i>
                        <p style="color:var(--text-muted);font-size:0.85rem;">Nenhum cliente encontrado para ligação.</p>
                    </div>`;
                return;
            }

            const start = (this.currentPage - 1) * this.itemsPerPage;
            const pageItems = filtered.slice(start, start + this.itemsPerPage);

            container.innerHTML = pageItems.map(p => {
                const isContacted = p.contacted === 'Sim';
                const rInfo = RATING_INFO[p.rating] || RATING_INFO['Média'];
                const phoneDigits = (p.phone || '').replace(/\D/g, '');
                
                // DISCADOR NATIVO TEL: (Abre direto o app de Telefone no Celular!)
                const telUrl = phoneDigits ? `tel:+55${phoneDigits}` : '#';
                const wppUrl = phoneDigits ? `https://wa.me/55${phoneDigits}` : '#';

                return `
                <div class="mobile-card">
                    <div class="mobile-card-header">
                        <div>
                            <div class="mobile-card-title">${this.esc(p.razaoSocial || p.name || 'Sem Nome')}</div>
                            <div class="mobile-card-buyer">👤 ${this.esc(p.buyer || 'Contato')} • 📍 ${this.esc(p.city || '—')}</div>
                        </div>

                        <button onclick="ProspecApp.openNotesModal('${p.id}')" class="btn-mobile btn-mobile-outline" style="width:auto;padding:0.3rem 0.6rem;font-size:0.75rem;">
                            <i class='bx bx-notepad'></i> Notas
                        </button>
                    </div>

                    <!-- Badges de Status -->
                    <div class="mobile-card-meta">
                        <span class="mobile-badge ${isContacted ? 'badge-contacted-yes' : 'badge-contacted-no'}"
                              onclick="ProspecApp.updateProspect('${p.id}', { contacted: '${isContacted ? 'Não' : 'Sim'}' })">
                            ${isContacted ? '🟢 Já Ligou' : '⚪ Não Ligou'}
                        </span>

                        <select class="mobile-input" style="width:auto;padding:0.25rem 0.5rem;font-size:0.75rem;font-weight:700;background:${rInfo.bg};color:${rInfo.color};border:1px solid ${rInfo.color}44;"
                                onchange="ProspecApp.updateProspect('${p.id}', { rating: this.value })">
                            <option value="Boa" ${p.rating === 'Boa' ? 'selected' : ''}>🟢 Boa</option>
                            <option value="Média" ${p.rating === 'Média' ? 'selected' : ''}>🟡 Média</option>
                            <option value="Ruim" ${p.rating === 'Ruim' ? 'selected' : ''}>🔴 Ruim</option>
                            <option value="Péssima" ${p.rating === 'Péssima' ? 'selected' : ''}>🟣 Péssima</option>
                        </select>
                    </div>

                    <!-- Anotações em Texto -->
                    <textarea class="mobile-notes-area" rows="2" placeholder="Observações rápidas da ligação..."
                              onchange="ProspecApp.updateProspect('${p.id}', { notes: this.value })">${this.esc(p.notes || '')}</textarea>

                    <!-- BOTÃO PRINCIPAL: DISCADOR NATIVO DO CELULAR (TEL:) -->
                    <div style="display:flex;gap:0.6rem;margin-top:0.3rem;">
                        <a href="${telUrl}" class="btn-call-native" style="flex:2;">
                            <i class='bx bx-phone-call'></i> Ligar para ${this.esc(p.phone || 'Número')}
                        </a>

                        <a href="${wppUrl}" target="_blank" class="btn-mobile btn-mobile-outline" style="flex:1;color:var(--wpp-color);border-color:rgba(37,211,102,0.3);" title="WhatsApp">
                            <i class='bx bxl-whatsapp' style="font-size:1.3rem;"></i>
                        </a>
                    </div>
                </div>`;
            }).join('');
        };

        // Service worker PWA registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
            });
        }
    </script>
</body>
</html>
