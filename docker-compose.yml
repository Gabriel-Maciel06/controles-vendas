version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: isapel_user
      POSTGRES_PASSWORD: isapel_password123
      POSTGRES_DB: isapel_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://isapel_user:isapel_password123@db:5432/isapel_crm
      # Adicione outras variáveis de ambiente se necessário (como CORS_ORIGINS)
    command: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

volumes:
  postgres_data:
